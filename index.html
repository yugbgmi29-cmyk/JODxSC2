<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JODxREAL | VIP</title>
    
    <!-- Snap Pixel Code -->

    <style>
        :root {
            --tg-blue: #229ED9;
            --bg-dark: #0b0e14;
            --text-white: #ffffff;
            --text-gray: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            padding-bottom: 30px;
        }

        /* Header */
        .tg-header {
            display: flex;
            align-items: center;
            padding: 15px;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .header-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header-info h1 { font-size: 16px; font-weight: 600; }
        .header-info p { font-size: 12px; color: var(--tg-blue); margin-top: 2px; }

        /* Badi Image Fade Effect */
        .hero-img-container {
            width: 100%;
            height: 400px;
            background-image: url('https://i.ibb.co/VWXqj6jG/Picsart-26-08-15-14-43-43-601.jpg');
            background-size: cover;
            background-position: center top;
            /* Smooth fade: 0% opacity at bottom, 100% at top */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        .content-area {
            padding: 0 20px;
            margin-top: -80px;
            z-index: 5;
        }

        /* Animated Join Button */
        .join-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 22px;
            background: var(--tg-blue);
            border-radius: 14px;
            color: white;
            font-weight: 800;
            font-size: 20px;
            text-decoration: none;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(34, 158, 217, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 158, 217, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(34, 158, 217, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 158, 217, 0); }
        }

        /* Countdown */
        .timer-box {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
        }

        .timer-label { font-size: 13px; font-weight: 700; color: #ff3b30; margin-bottom: 5px; text-transform: uppercase; }
        .timer-val { font-size: 36px; font-weight: 900; color: #fbbf24; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 5px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-n { font-size: 16px; font-weight: 800; }
        .stat-l { font-size: 10px; color: var(--text-gray); text-transform: uppercase; margin-top: 4px;}

    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="tg-header">
            <img src="https://i.ibb.co/VWXqj6jG/Picsart-26-08-15-14-43-43-601.jpg" class="header-icon">
            <div class="header-info">
                <h1>JODxREAL</h1>
                <p>Private channel</p>
            </div>
        </header>

        <!-- Fading Profile -->
        <div class="hero-img-container"></div>

        <div class="content-area">
            <!-- Join Button -->
            <a href="https://telegram.me/+VsSKKLuJSZk1NmFl" class="join-btn">
                <span>JOIN NOW</span>
                <span>→</span>
            </a>

            <!-- Urgent Countdown -->
            <div class="timer-box">
                <div class="timer-label">⚠️ LINK EXPIRES IN</div>
                <div class="timer-val" id="timer">00:10</div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-n">99.9%</div>
                    <div class="stat-l">Accuracy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-n">24/7</div>
                    <div class="stat-l">Support</div>
                </div>
                <div class="stat-card">
                    <div class="stat-n">100%</div>
                    <div class="stat-l">Secure</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "00:00";
            } else {
                timeLeft--;
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                timerElement.textContent = `00:${seconds}`;
            }
        }, 1000);
    </script>
</body>
</html>
